name: Model Output PoC

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Controlled model value"
        required: true
        type: string
        default: "POC_MARKER"

jobs:
  probe:
    name: Test model data flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run probe-model.sh
        id: probe
        env:
          E2E_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          echo "[POC] Supplied input:"
          printf '<%s>\n' "$E2E_MODEL"

          scripts/probe-model.sh opencode --github-output

      - name: Inspect GitHub outputs
        env:
          MODEL: ${{ steps.probe.outputs.model }}
          FALLBACK: ${{ steps.probe.outputs.fallback }}
          CANDIDATES: ${{ steps.probe.outputs.candidates }}
        run: |
          set -euo pipefail

          echo "[POC] steps.probe.outputs.model:"
          printf '<%s>\n' "$MODEL"

          echo "[POC] steps.probe.outputs.fallback:"
          printf '<%s>\n' "$FALLBACK"

          echo "[POC] steps.probe.outputs.candidates:"
          printf '<%s>\n' "$CANDIDATES"

          if [ "$MODEL" = "$E2E_MODEL" ]; then
            echo "[POC] INPUT_REACHED_OUTPUT=true"
          else
            echo "[POC] INPUT_REACHED_OUTPUT=false"
            echo "[POC] The probe resolved/changed the supplied value."
          fi
